<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D55C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forscher-Insel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forscher-Insel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+DE+Grund:wght@300;400&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: ein Schulheft – liniertes Papier, Tintenblau, Sonnengelb als einziger Akzent. Kind: Lernpfad. Eltern: Übersicht. */
:root{
  --paper:#F3F6FA; --card:#FFFFFF; --ink:#16304F; --muted:#5B6C82; --line:#CBD8E8;
  --blue:#1D55C4; --blue-soft:#DDE7FA; --water:#8EBAF2; --sun:#F2B705; --sun-soft:#FFF2C4;
  --ok:#2C8A57; --ok-soft:#DDF2E5; --bad:#C0453A; --bad-soft:#FBE3E0;
  --f-hand:'Playwrite DE Grund', 'Andika', cursive;
  --f-body:'Andika', 'Segoe UI', system-ui, sans-serif;
  --f-ko:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1625; --card:#152038; --ink:#E5ECF6; --muted:#97A7BC; --line:#2A3B57;
  --blue:#86AEFF; --blue-soft:#1C2D4D; --water:#3366B3; --sun:#F5C842; --sun-soft:#3A3115;
  --ok:#62C690; --ok-soft:#173527; --bad:#F2867B; --bad-soft:#3E1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1625; --card:#152038; --ink:#E5ECF6; --muted:#97A7BC; --line:#2A3B57;
  --blue:#86AEFF; --blue-soft:#1C2D4D; --water:#3366B3; --sun:#F5C842; --sun-soft:#3A3115;
  --ok:#62C690; --ok-soft:#173527; --bad:#F2867B; --bad-soft:#3E1F1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.hand{font-family:var(--f-hand);font-weight:400}
.ko{font-family:var(--f-ko)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:2px solid var(--blue);background:var(--blue);color:var(--card);border-radius:12px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2A2200}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;z-index:50;max-width:90vw}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top .kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-family:var(--f-hand);font-weight:400;font-size:clamp(26px,6vw,36px);line-height:1.35;color:var(--blue)}
.countdown{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-weight:700;text-align:center;flex:none}
.countdown b{display:block;font-size:24px;line-height:1}

/* Heft-Linien */
.lined{background:var(--card);border-radius:14px;padding:18px 18px 20px 46px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);background-position:0 14px;border:1px solid var(--line)}
.lined::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--bad);opacity:.35}

/* Lernpfad */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.path::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;border-left:3px dashed var(--line)}
.stop{display:flex;gap:14px;align-items:center;padding:8px 0;position:relative}
.stop button.main{flex:1;min-width:0;display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stop button.main:hover{border-color:var(--blue)}
.drop{width:56px;height:56px;flex:none;display:grid;place-items:center;position:relative;z-index:1}
.drop svg{position:absolute;inset:0;width:100%;height:100%}
.drop span{position:relative;font-weight:700;font-size:18px;margin-top:8px}
.stop .t{font-weight:700;line-height:1.25}
.stop .s{font-size:14px;color:var(--muted)}
.stars{color:var(--sun);letter-spacing:2px;font-size:18px;flex:none}
.stars .off{color:var(--line)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sun-soft);color:var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.tile b{display:block;font-size:17px}
.tile span{font-size:14px;color:var(--muted)}
.tile.hl{background:var(--blue-soft);border-color:var(--blue)}

/* Lernkarte */
.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--blue);border-color:var(--blue)}
.merk{list-style:none;margin:0;padding:0}
.merk li{display:flex;gap:10px;align-items:flex-start;min-height:34px;line-height:34px;padding:0}
.merk li .txt{flex:1;min-width:0}
.merk .icon-btn{width:30px;height:30px;margin-top:2px}
.merk .icon-btn svg{width:16px;height:16px}
.w{border:0;background:var(--sun-soft);color:inherit;border-bottom:2px solid var(--sun);padding:0 3px;border-radius:4px;font:inherit;line-height:1.4;cursor:pointer}
.pop{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));background:var(--card);border:2px solid var(--blue);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop .big{font-size:26px;font-weight:700}
.pop .syl{font-size:18px;color:var(--blue);letter-spacing:.04em}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wcard .wt{font-weight:700;font-size:19px}
.wcard .syl{color:var(--blue);font-size:15px}
.wcard .row{margin-top:4px}
.slow{font-size:13px;width:auto;padding:0 10px;border-radius:999px}

/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.qtext{font-size:20px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.qtext .txt{flex:1;min-width:0}
.fig{margin:12px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto;display:block;margin:0 auto}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;font-size:17px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tf{flex-direction:row}.tf .opt{flex:1;text-align:center;font-weight:700}
.seq{display:flex;flex-direction:column;gap:8px;min-height:40px;margin-top:12px;padding:10px;border:2px dashed var(--line);border-radius:12px}
.seq .opt{display:flex;gap:10px;align-items:center}
.seq .n{width:28px;height:28px;border-radius:50%;background:var(--blue);color:var(--card);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.sortrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sortrow .item{font-weight:700;min-width:80px;flex:1}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.matchrow select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.cloze{font-size:18px;line-height:2.4}
.blank{min-width:110px;border:0;border-bottom:3px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:2px 10px;font:inherit;font-weight:700;color:var(--blue)}
.blank.active{background:var(--sun-soft);border-color:var(--sun)}
.blank.right{border-color:var(--ok);color:var(--ok)}.blank.wrong{border-color:var(--bad);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
textarea{width:100%;min-height:120px;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);line-height:34px}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb p{margin:4px 0 0;font-weight:400;color:var(--ink)}
.model{background:var(--sun-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.qfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

.result{text-align:center;padding:20px 0}
.result .score{font-family:var(--f-hand);font-size:44px;color:var(--blue)}
.result .stars{font-size:40px}
.rev{text-align:left;margin-top:16px}
.rev li{margin-bottom:10px}


/* Verstehen */
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--water)} .dots i.on{background:var(--blue);width:26px;border-radius:999px}
.ltitle{font-size:22px;color:var(--blue);margin:4px 0 6px;line-height:1.4}
.ltext{display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.6}
.ltext p{margin:2px 0 0;flex:1;min-width:0}
.ko-toggle{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--muted);margin-top:10px}
.kotext{background:var(--blue-soft);border-radius:10px;padding:10px 12px;margin:8px 0 0;font-size:15.5px;line-height:1.6}
.sim{background:var(--paper);border-radius:12px;padding:10px;text-align:center}
.sim svg{max-width:100%;height:auto}
.simctl{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:16px;margin-top:6px}
.simctl input{width:min(320px,100%);accent-color:var(--blue)}
.simcap{margin-top:8px;font-size:16px;min-height:2.6em}
.tipcard{border-color:var(--ok);background:var(--ok-soft)} .warncard{border-color:var(--sun);background:var(--sun-soft)}
.tipcard .ltitle{color:var(--ok)}


/* Wer lernt? */
.av{display:inline-grid;place-items:center;border-radius:50%;color:var(--card);font-weight:700;flex:none;line-height:1}
.av.plus{width:64px;height:64px;font-size:34px;background:var(--card);color:var(--blue);border:3px dashed var(--blue)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.whobtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center}
.whobtn:hover{border-color:var(--blue)}
.whobtn b{font-size:20px;line-height:1.2;word-break:break-word}
.whobtn .muted{font-size:13px}
.newname{display:flex;flex-direction:column;gap:10px}
.newname input{font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);flex:1;min-width:0}
.swap{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px 0;margin-top:4px}

/* Elternbereich */
.parent{font-family:var(--f-ko);font-size:15.5px}
.parent h2{font-size:19px;margin:26px 0 10px}
.parent .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--f-body)}
.kpi span{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:13px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.meter{height:8px;border-radius:999px;background:var(--line);width:100px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.meter i{display:block;height:100%}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.p-none{background:var(--line);color:var(--muted)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mid{background:var(--sun-soft);color:var(--ink)}.p-ok{background:var(--ok-soft);color:var(--ok)}
.obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.obs li{display:flex;gap:10px;align-items:flex-start}
.obs .pill{margin-top:2px}
.wrongitem{border-bottom:1px solid var(--line);padding:10px 0}
.wrongitem:last-child{border-bottom:0}
.de{font-family:var(--f-body)}
details.unit{border-bottom:1px solid var(--line);padding:10px 0}
details.unit summary{cursor:pointer;font-weight:700}
.dict{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;margin-top:8px}
.dict .de{font-weight:700}
.days{display:flex;gap:6px;align-items:flex-end;height:70px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.days i{display:block;width:100%;max-width:28px;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.set{display:grid;gap:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.set input{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.gate{max-width:360px;margin:40px auto;text-align:center}
.gate input{font-size:24px;width:140px;text-align:center;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.foot-link{display:block;margin:28px auto 0;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px}
@media (max-width:480px){.qtext{font-size:18px}.matchrow{grid-template-columns:1fr}.lined{padding-left:38px}.lined::before{left:24px}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.blank{transition:background .15s,border-color .15s}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script src="topics.bundle.js"></script>
<script>
(function(){
'use strict';
const $app = document.getElementById('app');
const KEY = 'wasserforscher-v1';
const ICON = {
  spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
};

/* ---------- Speicher ---------- */
const PKEY = 'forscher-insel-profile-v1';
const blank = name => ({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:name||'', log:[], free:{}, best:{}, exams:{}, koHint:false, topic:'', created:Date.now(), used:0});
function migrateOne(S){ // v1 (nur Thema Wasser, IDs ohne Präfix) -> v2
  if(!S.exams) S.exams={}; if(S.exam){ S.exams.wasser=S.exam; delete S.exam; }
  const fx=id=> (id && !/^(hoer:|[a-z]+-)/.test(id)) ? ((/^(u10|d\d)$/.test(id))?'demokratie-':'wasser-')+id.replace(/^u10$/,'u1') : id;
  (S.log||[]).forEach(r=>{ if(r.m!=='hoer'){ r.q=fx(r.q); } r.u=fx(r.u); });
  const nf={}; Object.keys(S.free||{}).forEach(k=>nf[fx(k)]=S.free[k]); S.free=nf;
  const nb={}; Object.keys(S.best||{}).forEach(k=>nb[fx(k)]=S.best[k]); S.best=nb;
  if('extra' in S) delete S['extra'];
  return S;
}
function loadDB(){
  let db=null; try{ db=JSON.parse(localStorage.getItem(PKEY)); }catch(e){}
  if(!db || !Array.isArray(db.profiles)) db={profiles:[]};
  if(!db.profiles.length){ // altes Einzelprofil übernehmen
    let old=null; try{ old=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
    if(old && old.log){ const p=Object.assign(blank(old.name||'Kind 1'), migrateOne(old)); if(!p.name) p.name='Kind 1'; if(!p.id) p.id=blank().id; p.used=Date.now(); db.profiles.push(p); }
  }
  db.profiles.forEach(migrateOne);
  return db;
}
const DB = loadDB();
let S = blank('');   // aktives Profil; wird auf dem Startbildschirm gewählt
function save(){ if(!DB.profiles.includes(S)) return; try{ localStorage.setItem(PKEY, JSON.stringify(DB)); }catch(e){} }
function useProfile(p){ S=p; S.used=Date.now(); save(); }
function addProfile(name){
  name=name.trim().slice(0,20); if(!name) return null;
  const ex=DB.profiles.find(p=>p.name.toLowerCase()===name.toLowerCase()); if(ex) return ex;
  const p=blank(name); DB.profiles.push(p); return p;
}
const AV=['var(--blue)','var(--ok)','var(--sun)','var(--bad)','var(--water)'];
function avatar(p,size=56){ const i=Math.max(0,DB.profiles.indexOf(p)); const c=AV[i%AV.length];
  return `<span class="av" style="width:${size}px;height:${size}px;background:${c};font-size:${Math.round(size*.42)}px" aria-hidden="true">${esc((p.name||'?').charAt(0).toUpperCase())}</span>`; }

/* ---------- Daten aufbereiten ---------- */
const TOPICS = (window.TOPICS||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
const QBY = {}, UBY = {}, GLOSS = {}, TBY = {}, CONCEPTS = {};
TOPICS.forEach(t=>{ TBY[t.id]=t; Object.assign(CONCEPTS, t.concepts||{});
  t.units.forEach((u,i)=>{ u.id=t.id+'-'+u.id; u.no=i+1; u.tid=t.id; UBY[u.id]=u;
    u.q.forEach(q=>{ q.id=t.id+'-'+q.id; q.u=u.id; q.c=q.c||u.c; QBY[q.id]=q; });
    u.words.forEach(w=>{ const base=w.w.replace(/^(der|die|das)\s+/,''); GLOSS[base.toLowerCase()]=w; w.u=u.id; }); }); });
const ALLWORDS = TOPICS.flatMap(t=>t.units.flatMap(u=>u.words));
function cur(){ return TBY[S.topic] || TOPICS.find(t=>t.current) || TOPICS[0]; }

/* ---------- Hilfen ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain = s => String(s).replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g,'$1');
function rich(s){
  return esc(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,txt,key)=>`<button class="w" data-word="${esc(key||txt)}" data-say="${esc(txt)}">${txt}</button>`);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
const spk = (say,cls='') => `<button class="icon-btn ${cls}" data-speak="${esc(say)}" aria-label="Vorlesen">${ICON.spk}</button>`;

/* ---------- Vorlesen ---------- */
let voice=null, warned=false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));
  voice = vs.find(v=>/de-DE/i.test(v.lang) && /google|anna|katja|helena|hedda|petra|marlene|vicki/i.test(v.name)) || vs.find(v=>/de-DE/i.test(v.lang)) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if(!('speechSynthesis' in window)){ toast('Vorlesen geht auf diesem Gerät leider nicht.'); return; }
  let t = plain(text).replace(/(\d+)\s*°C/g,'$1 Grad Celsius').replace(/·/g,'').replace(/[„“]/g,'').replace(/___/g,'Lücke').replace(/\s…/g,' ');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang='de-DE'; if(voice) u.voice=voice; u.rate = slow?0.6:0.88; u.pitch=1.05;
  if(!voice && !warned){ warned=true; toast('Keine deutsche Stimme gefunden. Das Gerät liest vielleicht mit Akzent.'); }
  speechSynthesis.speak(u);
}

/* ---------- Statistik ---------- */
function record(q, ok, ans, mode, extra){
  S.log.push({q:q.id, u:q.u, c:q.c, ok:!!ok, a:ans, m:mode, t:Date.now(), ...(extra||{})});
  if(S.log.length>3000) S.log=S.log.slice(-3000);
  save();
}
function latestByQ(){ const m={}; S.log.forEach(r=>{ if(r.m!=='hoer') m[r.q]=r; }); return m; }
function unitStats(uid){
  const u=UBY[uid], L=latestByQ(); let seen=0, ok=0;
  u.q.forEach(q=>{ if(L[q.id]){ seen++; if(L[q.id].ok) ok++; } });
  const tries = S.log.filter(r=>r.u===uid && r.m!=='hoer').length;
  return {seen, ok, total:u.q.length, pct: seen? Math.round(ok/seen*100):null, tries};
}
function starsFor(uid){ const b=S.best[uid]; if(b==null) return 0; return b>=90?3: b>=70?2: b>=40?1:0; }
const starHTML = n => `<span class="stars" aria-label="${n} von 3 Sternen">${'★'.repeat(n)}<span class="off">${'★'.repeat(3-n)}</span></span>`;
function daysLeft(){ const ex=S.exams[cur().id]; if(!ex) return null; const d=new Date(ex+'T08:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }

   <path class="cloud" d="M53 50 L60 155 L140 155 L147 50 Z" fill="var(--card)" opacity="0"/>
   <rect class="oil" x="54" y="40" width="92" height="0" fill="var(--sun)" opacity=".8"/>
   <g class="grains"></g></svg>
  <div class="row" style="justify-content:center">${['Salz','Zucker','Sand','Öl','Mehl'].map(s=>`<button class="chip" data-s="${s}">${s}</button>`).join('')}</div>
  <div class="simcap">Tippe auf einen Stoff.</div>`,
 init(el){
  const g=el.querySelector('.grains'), cap=el.querySelector('.simcap'), cloud=el.querySelector('.cloud'), oil=el.querySelector('.oil');
  let G=[], kind='', t0=0;
  const txt={Salz:'Das Salz <b>löst sich</b>. Man sieht es nicht mehr, aber das Wasser schmeckt salzig. <b>wasserlöslich</b>',
   Zucker:'Der Zucker <b>löst sich</b>. Man sieht ihn nicht mehr, aber das Wasser schmeckt süß. <b>wasserlöslich</b>',
   Sand:'Der Sand <b>sinkt nach unten</b> und bleibt dort liegen. <b>nicht wasserlöslich</b>',
   Öl:'Das Öl <b>schwimmt oben</b>. Es mischt sich nicht mit Wasser. <b>nicht wasserlöslich</b>',
   Mehl:'Das Wasser wird <b>trüb</b>. Nach einer Weile setzt sich das Mehl unten ab. <b>nicht wasserlöslich</b>'};
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ kind=b.dataset.s; t0=performance.now(); g.innerHTML=''; G=[]; cloud.setAttribute('opacity',0); oil.setAttribute('height',0); oil.setAttribute('y',50);
    el.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(kind!=='Öl') for(let i=0;i<24;i++){ const c=svgEl('rect',{width:3.5,height:3.5,fill: kind==='Sand'?'#B08A4E':kind==='Mehl'?'var(--muted)':'var(--ink)'}); g.appendChild(c); G.push({c,x:rnd(75,125),y:rnd(5,30),v:rnd(1,2),o:1}); }
    cap.innerHTML='…'; setTimeout(()=>{ if(kind===b.dataset.s) cap.innerHTML=txt[kind]; }, RM?0:1600); });
  loop(el,t=>{ if(!kind) return; const dt=(t-t0)/1000;
    if(kind==='Öl'){ const h=Math.min(12, dt*8); oil.setAttribute('height',h); oil.setAttribute('y',50-h+ (dt<1?0:0)); return; }
    if(kind==='Mehl'){ cloud.setAttribute('opacity', dt<1.5? Math.min(.55,dt*.4) : Math.max(.12,.55-(dt-1.5)*.08)); }
    G.forEach((p,i)=>{ const floor= 150-(i%6)*2.4; const inW=p.y>50;
      p.y+= inW ? (kind==='Sand'?p.v*1.2: kind==='Mehl'? (dt<2?.25:.5) : p.v*.6) : p.v*1.8;
      if(p.y>floor) p.y=floor;
      if((kind==='Salz'||kind==='Zucker') && inW) p.o=Math.max(0,p.o-0.012);
      if(kind==='Mehl' && inW && dt<2) p.x+=rnd(-1,1);
      p.c.setAttribute('x',p.x.toFixed(1)); p.c.setAttribute('y',p.y.toFixed(1)); p.c.setAttribute('opacity',p.o.toFixed(2)); }); });
 }
},

function initSims(root){ root.querySelectorAll('[data-sim]').forEach(el=>{ const s=SIM[el.dataset.sim]; if(s) s.init(el); }); }

/* ---------- Router ---------- */
let view={name:'who'};
function go(v){ view=v; if('speechSynthesis' in window) speechSynthesis.cancel(); render(); window.scrollTo(0,0); }
function render(){
  closePop(); stopSims();
  const v=view.name;
  if(v==='who') return whoView();
  if(v==='home') return home();
  if(v==='unit') return unitView();
  if(v==='quiz') return quizView();
  if(v==='result') return resultView();
  if(v==='dict') return dictView();
  if(v==='hoer') return hoerView();
  if(v==='gate') return gateView();
  if(v==='parent') return parentView();
}

/* ---------- Wer lernt? ---------- */
function whoView(){
  const ps=DB.profiles.slice().sort((a,b)=>(b.used||0)-(a.used||0));
  const adding = view.add || !ps.length;
  $app.innerHTML=`<header class="top"><div><div class="kicker">Forscher-Insel</div><h1>Wer lernt heute?</h1></div></header>
   ${ps.length?`<div class="who">${ps.map(p=>{ const ls=p.log.length?p.log[p.log.length-1].t:0;
     return `<button class="whobtn" data-pid="${p.id}">${avatar(p,64)}<b>${esc(p.name)}</b><span class="muted">${ls?'zuletzt '+fmt(ls).split(' ')[0]:'noch nicht geübt'}</span></button>`; }).join('')}
     ${adding?'':`<button class="whobtn add" id="add"><span class="av plus" aria-hidden="true">+</span><b>Neuer Name</b><span class="muted">Ich bin neu hier</span></button>`}</div>`:''}
   ${adding?`<form class="tile hl newname" id="nf" autocomplete="off"><label for="nm"><b>${ps.length?'Wie heißt du?':'Hallo! Wie heißt du?'}</b></label>
     <div class="row" style="flex-wrap:nowrap"><input id="nm" maxlength="20" placeholder="Vorname"><button class="btn" type="submit">Los!</button></div>
     <p id="nmerr" class="muted" hidden></p>
     ${ps.length?'<button type="button" class="back" id="cancel">Abbrechen</button>':''}</form>`:''}`;
  $app.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{ useProfile(DB.profiles.find(p=>p.id===b.dataset.pid)); go({name:'home'}); });
  const ad=document.getElementById('add'); if(ad) ad.onclick=()=>{ view.add=true; render(); document.getElementById('nm').focus(); };
  const cc=document.getElementById('cancel'); if(cc) cc.onclick=()=>{ view.add=false; render(); };
  const nf=document.getElementById('nf');
  if(nf) nf.onsubmit=e=>{ e.preventDefault(); const v=document.getElementById('nm').value.trim();
    if(!v){ const er=document.getElementById('nmerr'); er.hidden=false; er.textContent='Schreib bitte deinen Namen.'; return; }
    if(DB.profiles.length>=8 && !DB.profiles.some(p=>p.name.toLowerCase()===v.toLowerCase())){ const er=document.getElementById('nmerr'); er.hidden=false; er.textContent='Es gibt schon 8 Namen. Ein Erwachsener kann im Elternbereich Namen löschen.'; return; }
    useProfile(addProfile(v)); go({name:'home'}); };
}

/* ---------- Start ---------- */
function home(){
  const T = cur(), units = T.units;
  const dl = daysLeft();
  const L = latestByQ();
  const wrongCount = Object.values(L).filter(r=>!r.ok && inTopic(r,T)).length;
  const tw = units.reduce((n,u)=>n+u.words.length,0);
  const next = units.find(u=>starsFor(u.id)<2) || units[0];
  $app.innerHTML = `
  <header class="top">
    <div><div class="kicker">Forscher-Insel · Klasse ${T.klasse||3} · ${esc(T.subject||'Sachunterricht')}</div>
    <div class="row" style="gap:12px;flex-wrap:nowrap">${avatar(S,44)}<h1>Hallo ${esc(S.name)}!</h1></div>
    <button class="swap" id="swap">Nicht ${esc(S.name)}? Wechseln</button></div>
    ${dl!=null && dl>=0 ? `<div class="countdown"><b>${dl}</b>${dl===1?'Tag':'Tage'} bis zum Test</div>`:''}
  </header>
  ${TOPICS.length>1?`<div class="row" aria-label="Thema" style="margin:-4px 0 14px">${TOPICS.map(t=>`<button class="chip" data-topic="${t.id}" aria-pressed="${t.id===T.id}">${esc(t.title)}</button>`).join('')}</div>`:''}
  <div class="tiles">
    <button class="tile hl" data-go-unit="${next.id}"><b>Weiterlernen</b><span>${next.no}. ${esc(next.title)}</span></button>
    <button class="tile" id="test"><b>Probetest</b><span>12 gemischte Aufgaben</span></button>
    <button class="tile" id="fehler" ${wrongCount?'':'disabled style="opacity:.55"'}><b>Fehlerkiste</b><span>${wrongCount} Aufgabe${wrongCount===1?'':'n'} nochmal üben</span></button>
    <button class="tile" id="dict"><b>Wörter hören</b><span>${tw} schwere Wörter mit Ton</span></button>
  </div>
  <h2 class="hand" style="font-size:22px;color:var(--blue);margin:8px 0 6px">Dein Lernweg: ${esc(T.title)}</h2>
  <ol class="path">${units.map(u=>{
    const st=unitStats(u.id), n=starsFor(u.id);
    const fill = n>=2?'var(--blue)':st.seen?'var(--water)':'var(--line)';
    const tc = n>=2?'var(--card)':'var(--ink)';
    return `<li class="stop"><div class="drop"><svg viewBox="0 0 56 56" aria-hidden="true"><path d="M28 3 C28 3 8 26 8 37 a20 20 0 0 0 40 0 C48 26 28 3 28 3z" fill="${fill}"/></svg><span style="color:${tc}">${u.no}</span></div>
      <button class="main" data-go-unit="${u.id}"><div style="flex:1;min-width:0"><div class="t">${esc(u.title)} ${u.extra?'<span class="tag">Extra</span>':''}</div><div class="s">${esc(u.sub)}</div></div>${starHTML(n)}</button></li>`;}).join('')}
  </ol>
  <button class="foot-link ko" id="parent">부모님 화면 (Für Eltern)</button>`;
  document.getElementById('swap').onclick=()=>go({name:'who'});
  bindCommon();
  document.getElementById('test').onclick=()=>startQuiz('test');
  const f=document.getElementById('fehler'); if(wrongCount) f.onclick=()=>startQuiz('fehler');
  document.getElementById('dict').onclick=()=>go({name:'dict'});
  document.getElementById('parent').onclick=()=>go({name:'gate'});
  $app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{ S.topic=b.dataset.topic; save(); render(); });
}

/* ---------- Einheit ---------- */
function unitView(){
  const u=UBY[view.id], tab=view.tab||(u.lesson?'verstehen':'lernen'), st=unitStats(u.id);
  let body='';
  if(tab==='verstehen' && u.lesson){ body=lessonHTML(u); }
  else if(tab==='lernen'){
    body=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted">Tippe auf gelbe Wörter: Du hörst sie und siehst, was sie bedeuten.</span>
      <button class="btn ghost" data-speak="${esc(u.merk.join(' '))}">Alles vorlesen</button></div>
      <div class="lined"><ul class="merk">${u.merk.map(m=>`<li>${spk(m)}<span class="txt">${rich(m)}</span></li>`).join('')}</ul></div>
      <div class="qfoot"><button class="btn ghost" data-tab="woerter">Wörter</button><button class="btn" id="start">Jetzt üben</button></div>`;
  } else if(tab==='woerter'){
    body=`<p class="muted">Hör zu und sprich nach. Mit „langsam“ hörst du das Wort ganz deutlich.</p>${wordCards(u.words)}
      <div class="qfoot"><button class="btn" id="start">Jetzt üben</button></div>`;
  } else {
    body=`<div class="lined" style="padding-top:20px"><p style="margin:0;line-height:34px"><b>${u.q.length} Aufgaben</b> warten auf dich.<br>
      ${st.seen?`Zuletzt: ${st.ok} von ${st.seen} richtig.`:'Du hast hier noch nicht geübt.'}</p></div>
      <div class="qfoot"><button class="btn" id="start">Los geht’s</button></div>`;
  }
  $app.innerHTML=`<button class="back" id="bk">‹ Zurück</button>
    <header class="top" style="margin-top:6px"><div><div class="kicker">Station ${u.no}${u.extra?' · Extra':''}</div><h1>${esc(u.title)}</h1><div class="muted">${esc(u.sub)}</div></div>${starHTML(starsFor(u.id))}</header>
    <div class="tabs" role="tablist">${[...(u.lesson?[['verstehen','Verstehen']]:[]),['lernen','Merken'],['woerter','Wörter'],['ueben','Üben']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
  document.getElementById('bk').onclick=()=>go({name:'home'});
  $app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; view.step=0; render(); window.scrollTo(0,0); });
  const s=document.getElementById('start'); if(s) s.onclick=()=>startQuiz('practice',u.id);
  $app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ view.step=+b.dataset.step; render(); const c=document.getElementById('lcard'); if(c) c.scrollIntoView({block:'start'}); });
  $app.querySelectorAll('.ko-toggle').forEach(b=>b.onclick=()=>{ const p=b.nextElementSibling; p.hidden=!p.hidden; b.setAttribute('aria-expanded',!p.hidden); });
  bindCommon(); initSims($app);
}
function lessonHTML(u){
  const L=u.lesson, n=L.steps.length, i=Math.min(view.step||0, n);
  const dots=`<div class="dots" aria-hidden="true">${Array.from({length:n+1},(_,k)=>`<i class="${k===i?'on':k<i?'done':''}"></i>`).join('')}</div>`;

/* ---------- Quiz ---------- */
let Q=null;
function startQuiz(mode, uid){
  let list;
  const active=cur().units;
  if(mode==='practice') list=UBY[uid].q.slice();
  else if(mode==='fehler'){ const L=latestByQ(); list=Object.values(L).filter(r=>!r.ok && inTopic(r,cur())).map(r=>QBY[r.q]).filter(Boolean); }
  else if(mode==='retry') list=uid;
  else { list=shuffle(active.filter(u=>!u.extra).flatMap(u=>u.q.filter(q=>q.t!=='free'))).slice(0,12); }
  Q={mode, uid:mode==='practice'?uid:null, list, i:0, res:[], state:null};
  go({name:'quiz'});
}
function newState(q){
  if(q.t==='order') return {pool:shuffle(q.items), seq:[]};
  if(q.t==='sort') return {sel:{}};
  if(q.t==='match') return {sel:{}, rights:shuffle(q.pairs.map(p=>p[1]))};
  if(q.t==='cloze') return {fill:q.ans.map(()=>null), act:0, bank:shuffle(q.bank)};
  if(q.t==='free') return {text:'', shown:false};
  return {sel:null};
}

  } else if(q.t==='match'){

      <select id="m-${q.id}-${i}" data-m="${i}" ${checked?'disabled':''}><option value="">– wählen –</option>${st.rights.map(x=>`<option ${st.sel[i]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('');
  } else if(q.t==='cloze'){

      return `<button class="blank ${cls}" data-blank="${n}" ${checked?'disabled':''}>${v?esc(v):'&nbsp;'}</button>`; });
    const used=st.fill.filter(Boolean);
    inner=`<div class="cloze">${html}</div><div class="bank">${st.bank.map(b=>`<button class="chip" data-bank="${esc(b)}" ${checked||used.includes(b)?'disabled':''}>${esc(b)}</button>`).join('')}</div>
      ${checked&&!test?`<p class="muted">Richtig: ${q.ans.map(esc).join(', ')}</p>`:''}`;
  } else if(q.t==='free'){
    inner=`<textarea id="free-${q.id}" placeholder="Schreibe hier deine Antwort …" ${st.shown?'readonly':''}>${esc(st.text)}</textarea>
      ${st.shown?`<div class="model"><b>So kann man es schreiben:</b><div class="row" style="align-items:flex-start;margin-top:6px">${spk(q.model)}<span style="flex:1;min-width:0">${esc(q.model)}</span></div></div>

      <div class="row">${[['ja','Ja'],['teil','Teilweise'],['nein','Nein']].map(([k,l])=>`<button class="chip" data-self="${k}">${l}</button>`).join('')}</div>`:''}`;
  }

  const canCheck = ready(q,st);
  const title = Q.mode==='test'?'Probetest: '+cur().title:Q.mode==='fehler'||Q.mode==='retry'?'Fehlerkiste':`${UBY[q.u].no}. ${UBY[q.u].title}`;

   ${q.img?`<div class="fig">${FIG[q.img]}</div>`:''}${inner}${fb}
   <div class="qfoot">${q.t==='free'? (st.shown?'':`<button class="btn" id="show" ${st.text.trim().length<3?'disabled':''}>Musterlösung zeigen</button>`)
     : checked? `<button class="btn" id="next">${Q.i+1<Q.list.length?'Weiter':'Fertig'}</button>`
     : `<button class="btn" id="check" ${canCheck?'':'disabled'}>${test?'Weiter':'Prüfen'}</button>`}</div></div>`;
  document.getElementById('bk').onclick=()=>go(Q.mode==='practice'?{name:'unit',id:Q.uid,tab:'ueben'}:{name:'home'});
  bindCommon();
  // Interaktion
  $app.querySelectorAll('.opt[data-i]').forEach(b=>b.onclick=()=>{ st.sel=+b.dataset.i; render(); });

  $app.querySelectorAll('select[data-m]').forEach(s=>s.onchange=()=>{ st.sel[+s.dataset.m]=s.value||undefined; render(); });
  $app.querySelectorAll('[data-blank]').forEach(b=>b.onclick=()=>{ const n=+b.dataset.blank; if(st.fill[n]) st.fill[n]=null; st.act=n; render(); });
  $app.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{ let n=st.act; if(n==null||st.fill[n]) n=st.fill.findIndex(x=>!x); if(n<0) return; st.fill[n]=b.dataset.bank; const nx=st.fill.findIndex(x=>!x); st.act=nx<0?null:nx; render(); });

  $app.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{ const k=b.dataset.self; const ok=k==='ja';
    record(q, ok, st.text.trim(), Q.mode, {self:k}); S.free[q.id]={text:st.text.trim(), self:k, t:Date.now()}; save();
    Q.res.push({q, ok, part:k==='teil'}); Q.i++; Q.state=null; render(); });
  const ck=document.getElementById('check'); if(ck) ck.onclick=()=>{ const r=evaluate(q,st); st.ok=r.ok; st.checked=true; record(q,r.ok,r.ans,Q.mode); Q.res.push({q,ok:r.ok,ans:r.ans});
    if(test){ Q.i++; Q.state=null; } render(); };
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>{ Q.i++; Q.state=null; render(); };

function ready(q,st){
  if(q.t==='mc'||q.t==='tf') return st.sel!=null;
  if(q.t==='order') return st.seq.length===q.items.length;
  if(q.t==='sort') return q.items.every((_,i)=>st.sel[i]!=null);
  if(q.t==='match') return q.pairs.every((_,i)=>st.sel[i]);
  if(q.t==='cloze') return st.fill.every(Boolean);
  return false;
}
function evaluate(q,st){
  if(q.t==='mc') return {ok:st.sel===q.a, ans:q.o[st.sel]};
  if(q.t==='tf') return {ok:(st.sel===0)===q.a, ans:st.sel===0?'Richtig':'Falsch'};
  if(q.t==='order') return {ok:st.seq.every((x,i)=>x===q.items[i]), ans:st.seq.join(' → ')};
  if(q.t==='sort') return {ok:q.items.every(([_,c],i)=>st.sel[i]===c), ans:q.items.map(([it],i)=>it+': '+q.cats[st.sel[i]]).join(', ')};
  if(q.t==='match') return {ok:q.pairs.every(([_,r],i)=>st.sel[i]===r), ans:q.pairs.map(([l],i)=>l+' = '+st.sel[i]).join('; ')};
  if(q.t==='cloze') return {ok:st.fill.every((v,i)=>v===q.ans[i]), ans:st.fill.join(', ')};
}
function correctText(q){
  if(q.t==='mc') return q.o[q.a];
  if(q.t==='tf') return q.a?'Richtig':'Falsch';
  if(q.t==='order') return q.items.join(' → ');
  if(q.t==='sort') return q.items.map(([it,c])=>it+': '+q.cats[c]).join(', ');
  if(q.t==='match') return q.pairs.map(p=>p.join(' = ')).join('; ');
  if(q.t==='cloze') return q.ans.join(', ');
  if(q.t==='free') return q.model;
}
function resultView(){
  const n=Q.res.length, ok=Q.res.filter(r=>r.ok).length + Q.res.filter(r=>r.part).length*0.5;
  const pct = n? Math.round(ok/n*100):0;
  let stars=0;
  if(Q.mode==='practice'){ S.best[Q.uid]=Math.max(S.best[Q.uid]||0,pct); save(); stars=starsFor(Q.uid); }
  else stars = pct>=90?3:pct>=70?2:pct>=40?1:0;
  const wrong=Q.res.filter(r=>!r.ok);
  const msg = pct>=90?'Spitze! Du bist ein echter Wasser-Forscher.':pct>=70?'Sehr gut! Nur noch ein paar Kleinigkeiten.':pct>=40?'Gut gemacht! Übe die Fehler noch einmal.':'Nicht schlimm! Lies die Lernkarte noch einmal und probier es wieder.';
  $app.innerHTML=`<div class="result"><div class="stars">${starHTML(stars)}</div><div class="score">${Number.isInteger(ok)?ok:ok.toFixed(1)} von ${n}</div><p style="font-size:19px">${msg}</p>
   <div class="row" style="justify-content:center">${wrong.length?'<button class="btn sun" id="retry">Fehler nochmal üben</button>':''}<button class="btn ghost" id="home">Zum Lernweg</button></div></div>
   ${wrong.length?`<div class="qcard rev"><b>Das solltest du dir merken:</b><ul>${wrong.map(r=>`<li>${rich(r.q.q)}<br><span style="color:var(--ok);font-weight:700">${esc(correctText(r.q))}</span></li>`).join('')}</ul></div>`:''}`;
  bindCommon();
  document.getElementById('home').onclick=()=>go({name:'home'});
  const rt=document.getElementById('retry'); if(rt) rt.onclick=()=>startQuiz('retry', wrong.map(r=>r.q));
}

function statusPill(st){
  if(!st.seen) return '<span class="pill p-none">미학습</span>';
  if(st.seen<st.total) return `<span class="pill p-mid">진행 중 ${st.seen}/${st.total}</span>`;
  if(st.pct>=85) return '<span class="pill p-ok">잘 이해함</span>';
  if(st.pct>=60) return '<span class="pill p-mid">거의 이해</span>';
  return '<span class="pill p-bad">연습 필요</span>';
}
function meter(p){ const c=p==null?'var(--line)':p>=85?'var(--ok)':p>=60?'var(--sun)':'var(--bad)'; return `<span class="meter"><i style="width:${p||0}%;background:${c}"></i></span>${p==null?'–':p+'%'}`; }
function fmt(t){ const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function parentView(){
  const T=cur(), units=T.units;
  const L=latestByQ(), latest=Object.values(L).filter(r=>inTopic(r,T));
  const OB=T.observations||{todo:[],good:[]};
  const totalQ=units.reduce((s,u)=>s+u.q.length,0);
  const seen=latest.length, okN=latest.filter(r=>r.ok).length;
  const tlog=S.log.filter(r=>inTopic(r,T)); const last=tlog.length?fmt(tlog[tlog.length-1].t):'–';
  // Konzepte
  const cc={}; latest.forEach(r=>{ (cc[r.c]=cc[r.c]||{n:0,ok:0}); cc[r.c].n++; if(r.ok) cc[r.c].ok++; });
  const hoer=S.log.filter(r=>r.m==='hoer' && inTopic(r,T)); if(hoer.length){ cc.hoeren={n:hoer.length, ok:hoer.filter(r=>r.ok).length}; }
  const weak=Object.entries(cc).map(([c,v])=>({c,n:v.n,pct:Math.round(v.ok/v.n*100)})).filter(x=>x.pct<85).sort((a,b)=>a.pct-b.pct).slice(0,6);
  const wrongs=tlog.filter(r=>!r.ok && r.m!=='hoer').slice(-12).reverse();
  const hoerWrong=[...new Set(hoer.filter(r=>!r.ok).map(r=>r.word))].slice(-10);
  // 7 Tage
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const e=d.getTime()+86400000; days.push({lab:['일','월','화','수','목','금','토'][d.getDay()], n:S.log.filter(r=>r.t>=d.getTime()&&r.t<e).length}); }
  const maxD=Math.max(1,...days.map(d=>d.n));
  // Plan
  const dl=daysLeft(); let plan='';
  if(dl!=null && dl>0){
    const todo=units.filter(u=>{ const s=unitStats(u.id); return !(s.seen===s.total && s.pct>=85); });
    const studyDays=Math.max(1,dl-1); const per=Math.ceil(todo.length/studyDays);
    const rows=[]; for(let d=0; d<studyDays && d*per<todo.length; d++){ const dt=new Date(); dt.setDate(dt.getDate()+d); rows.push(`<tr><td class="de">${dt.getMonth()+1}/${dt.getDate()}</td><td>${todo.slice(d*per,d*per+per).map(u=>`${u.no}. ${u.ko}`).join(', ')}</td></tr>`); }
    const pd=new Date(S.exams[T.id]); pd.setDate(pd.getDate()-1);
    plan=`<table class="tbl"><thead><tr><th>날짜</th><th>할 일</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="2">모든 단원을 잘 이해했습니다. 모의시험으로 마무리하세요.</td></tr>'}
      <tr><td class="de">${pd.getMonth()+1}/${pd.getDate()}</td><td>앱 Probetest + 출력한 모의시험 B, 틀린 문제는 Fehlerkiste로 복습</td></tr></tbody></table>`;
  }
  $app.innerHTML=`<div class="parent">
  <button class="back" id="bk">‹ 아이 화면으로</button>
  <header class="top" style="margin-top:6px"><div><div class="kicker">부모님 화면 · ${esc(T.subject||'')} · ${T.klasse||''}학년</div><h1 style="font-family:var(--f-ko);font-weight:700;color:var(--ink);font-size:26px">${S.name?esc(S.name)+'의 ':''}${esc(T.ko)} 학습 현황</h1></div>
   ${dl!=null&&dl>=0?`<div class="countdown"><b class="de">D-${dl}</b>시험</div>`:''}</header>

  ${DB.profiles.length>1?`<div class="row" style="margin:-4px 0 10px"><span class="muted" style="font-size:13px">아이:</span>${DB.profiles.map(p=>`<button class="chip" data-prof="${p.id}" aria-pressed="${p===S}">${esc(p.name)}</button>`).join('')}</div>`:''}
  ${TOPICS.length>1?`<div class="row" style="margin:-4px 0 14px">${TOPICS.map(t=>`<button class="chip" data-topic="${t.id}" aria-pressed="${t.id===T.id}">${esc(t.ko)}</button>`).join('')}</div>`:''}
  <div class="kpis">
    <div class="card kpi"><b>${seen}/${totalQ}</b><span>풀어 본 문제</span></div>
    <div class="card kpi"><b>${seen?Math.round(okN/seen*100)+'%':'–'}</b><span>현재 정답률(문제별 최근 답)</span></div>
    <div class="card kpi"><b>${units.filter(u=>starsFor(u.id)>=2).length}/${units.length}</b><span>별 2개 이상 단원</span></div>
    <div class="card kpi"><b style="font-size:18px;line-height:1.9">${last}</b><span>마지막 학습</span></div>
  </div>

  <h2>최근 7일 학습량</h2>
  <div class="card"><div class="days">${days.map(d=>`<div><i style="height:${Math.round(d.n/maxD*50)}px" title="${d.n}문제"></i><span class="de" style="color:var(--ink);font-size:12px">${d.n}</span>${d.lab}</div>`).join('')}</div></div>

  <h2>단원별 이해도 <span class="muted" style="font-size:13px;font-weight:400">(공부 순서대로)</span></h2>
  <div class="card scroll"><table class="tbl"><thead><tr><th>단원</th><th>정답률</th><th>상태</th><th>시도</th></tr></thead><tbody>
   ${units.map(u=>{ const st=unitStats(u.id); return `<tr><td><b>${u.no}. ${esc(u.ko)}</b><br><span class="de muted" style="font-size:13px">${esc(u.title)}</span></td><td style="white-space:nowrap">${meter(st.pct)}</td><td>${statusPill(st)}</td><td class="de">${st.tries}</td></tr>`;}).join('')}
  </tbody></table></div>

  <h2>보충이 필요한 개념</h2>
  <div class="card">${weak.length? `<ul class="obs">${weak.map(w=>`<li><span class="pill ${w.pct<60?'p-bad':'p-mid'} de">${w.pct}%</span><div><b>${CONCEPTS[w.c]||w.c}</b> <span class="muted">(${w.n}문제 기준)</span>${conceptHelp(w.c)}</div></li>`).join('')}</ul>`
    : `<p class="muted" style="margin:0">${seen?'정답률 85% 미만인 개념이 없습니다.':'아직 푼 문제가 없습니다. 아이가 문제를 풀면 여기에 약한 개념이 표시됩니다.'}</p>`}</div>

  <h2>사진(공책·학습지) 분석 소견 ${T.photos?`<span class="muted" style="font-size:13px;font-weight:400">(${esc(T.photos)})</span>`:''}</h2>
  <div class="card"><ul class="obs">${OB.todo.length?'':'<li class="muted">이 주제의 사진 분석 소견이 없습니다.</li>'}${OB.todo.map(([k,t])=>`<li><span class="pill ${k==='우선순위 높음'?'p-bad':'p-mid'}">${k}</span><span>${esc(t)}</span></li>`).join('')}</ul>
   <p style="margin:14px 0 6px;font-weight:700">잘한 점</p><ul class="obs">${(OB.good||[]).map(t=>`<li><span class="pill p-ok">잘함</span><span>${esc(t)}</span></li>`).join('')}</ul></div>

  <h2>최근 틀린 문제</h2>
  <div class="card">${wrongs.length? wrongs.map(r=>{ const q=QBY[r.q]; if(!q) return ''; return `<div class="wrongitem"><div class="muted" style="font-size:13px">${UBY[q.u].no}. ${esc(UBY[q.u].ko)} · ${fmt(r.t)}${r.m==='test'?' · 모의시험':''}</div>
     <div><b>${esc(q.ko)}</b></div><div class="de muted" style="font-size:14px">${esc(plain(q.q))}</div>
     <div style="margin-top:4px">아이 답: <span class="de" style="color:var(--bad)">${esc(r.a||'')}</span></div>
     <div>정답: <span class="de" style="color:var(--ok)">${esc(correctText(q))}</span></div>
     ${q.exk?`<div class="muted">설명: ${esc(q.exk)}</div>`:''}</div>`;}).join('') : '<p class="muted" style="margin:0">틀린 문제가 없습니다.</p>'}</div>

  <h2>서술형 답안</h2>
  <div class="card">${units.flatMap(u=>u.q.filter(q=>q.t==='free')).map(q=>{ const f=S.free[q.id];
     return `<div class="wrongitem"><b>${esc(q.ko)}</b><div style="margin-top:4px">${f?`아이 답: <span class="de">${esc(f.text)}</span> <span class="pill ${f.self==='ja'?'p-ok':f.self==='teil'?'p-mid':'p-bad'}">스스로 평가: ${f.self==='ja'?'다 씀':f.self==='teil'?'일부':'못 씀'}</span>`:'<span class="muted">아직 안 씀</span>'}</div>
     <div class="muted" style="margin-top:4px">모범 답안: <span class="de">${esc(q.model)}</span><br>뜻: ${esc(q.mk)}</div></div>`;}).join('')}
   <p class="muted" style="margin:8px 0 0;font-size:13px">서술형은 아이가 스스로 모범 답안과 비교해 평가합니다. 실제 내용은 위 답안을 직접 확인해 주세요.</p></div>

  ${hoerWrong.length?`<h2>듣기 게임에서 틀린 단어</h2><div class="card"><div class="dict">${hoerWrong.map(wd=>{ const w=ALLWORDS.find(x=>x.w===wd); return `<span class="de">${esc(wd)}</span><span>${esc(w?w.ko:'')}</span>${spk(wd)}`;}).join('')}</div></div>`:''}

  ${plan?`<h2>시험까지 추천 계획</h2><div class="card scroll">${plan}</div>`:''}

  <h2>단원별 설명과 단어 (부모님용)</h2>
  <div class="card">${units.map(u=>`<details class="unit"><summary>${u.no}. ${esc(u.ko)} <span class="de muted" style="font-weight:400">· ${esc(u.title)}</span></summary>
    <p>${esc(u.koSum)}</p>${u.lesson?`<p style="margin:8px 0 4px;font-weight:700">아이 앱 설명 카드 (한국어)</p><ol style="margin:0;padding-left:20px">${u.lesson.steps.map(s=>`<li><b>${esc(s.t)}</b> – ${esc(s.ko)}</li>`).join('')}</ol>${u.lesson.try?`<p style="margin:6px 0 0">집에서 해 보기: ${esc(u.lesson.try.ko)}</p>`:''}${u.lesson.fehler?`<p style="margin:4px 0 8px">자주 하는 실수: ${esc(u.lesson.fehler.ko)}</p>`:''}`:''}<div class="dict">${u.words.map(w=>`<span class="de">${esc(w.w)}</span><span>${esc(w.ko)}</span>${spk(w.w)}`).join('')}</div></details>`).join('')}</div>

  <h2>모의시험 출력</h2>
  <div class="card">${(T.pdfs||[]).length?`<p style="margin:0 0 10px">PDF를 열어 인쇄하세요. 정답지는 아이가 보지 않게 따로 보관하세요.</p>
   <div class="row">${T.pdfs.map((p,i)=>`<a class="btn ${i?'ghost':''}" href="${esc(p.file)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(p.label)}</a>`).join('')}</div>`:'<p class="muted" style="margin:0">이 주제는 출력용 모의시험이 아직 없습니다.</p>'}
   <p class="muted" style="margin:10px 0 0;font-size:13px">앱 안의 <span class="de">Probetest</span>는 매번 이 주제에서 최대 12문제를 무작위로 냅니다.</p></div>

  <h2>전체 주제 요약</h2>
  <div class="card scroll"><table class="tbl"><thead><tr><th>주제</th><th>배운 시기</th><th>정답률</th><th>시험일</th></tr></thead><tbody>${TOPICS.map(t=>{ const lt=Object.values(L).filter(r=>inTopic(r,t)); const p=lt.length?Math.round(lt.filter(r=>r.ok).length/lt.length*100):null;
    return `<tr><td><b>${esc(t.ko)}</b><br><span class="de muted" style="font-size:13px">${esc(t.subject||'')} · ${esc(t.title)}</span></td><td>${esc(t.period||'')}</td><td style="white-space:nowrap">${meter(p)}</td><td class="de">${esc(S.exams[t.id]||'–')}</td></tr>`;}).join('')}</tbody></table></div>

  <h2>설정</h2>
  <div class="card set">
    <label>이름 (${esc(S.name)})<input id="s-name" maxlength="20" value="${esc(S.name)}"></label>
    <label>시험 날짜 (${esc(T.ko)})<input id="s-exam" type="date" value="${esc(S.exams[T.id]||'')}"></label>
    <label style="flex-direction:row;align-items:center;gap:8px"><input id="s-ko" type="checkbox" ${S.koHint?'checked':''}> 아이 화면 단어 카드에 한국어 뜻도 표시</label>
    <div class="row"><button class="btn" id="s-save">저장</button><span id="s-msg" class="muted" hidden>저장했습니다.</span></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn ghost" id="p-del" style="border-color:var(--bad);color:var(--bad)">${esc(S.name)} 프로필 삭제</button>
      <span id="p-confirm" hidden>${esc(S.name)}의 모든 기록이 지워집니다. <button class="btn" id="p-yes" style="background:var(--bad);border-color:var(--bad)">삭제</button> <button class="btn ghost" id="p-no">취소</button></span></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn ghost" id="s-reset" style="border-color:var(--bad);color:var(--bad)">이 주제 학습 기록 지우기</button>
      <span id="s-confirm" hidden>정말 지울까요? <button class="btn" id="s-yes" style="background:var(--bad);border-color:var(--bad)">지우기</button> <button class="btn ghost" id="s-no">취소</button></span></div>
    <p class="muted" style="margin:0;font-size:13px">이름과 시험 날짜, 학습 기록은 아이(프로필)마다 따로 저장됩니다. 앱을 열 때마다 "Wer lernt heute?" 화면에서 이름을 고르거나 새 이름을 입력합니다. 학습 기록은 이 기기의 이 브라우저에만 저장됩니다. 아이가 쓰는 기기에서 이 화면을 열어 확인하세요.</p>
  </div></div>`;
  bindCommon();
  document.getElementById('bk').onclick=()=>go({name:'home'});
  $app.querySelectorAll('[data-prof]').forEach(b=>b.onclick=()=>{ useProfile(DB.profiles.find(p=>p.id===b.dataset.prof)); render(); });
  document.getElementById('p-del').onclick=()=>{ document.getElementById('p-confirm').hidden=false; };
  document.getElementById('p-no').onclick=()=>{ document.getElementById('p-confirm').hidden=true; };
  document.getElementById('p-yes').onclick=()=>{ DB.profiles=DB.profiles.filter(p=>p!==S); try{ localStorage.setItem(PKEY, JSON.stringify(DB)); }catch(e){} S=blank(''); go({name:'who'}); };
  document.getElementById('s-save').onclick=()=>{ const nn=document.getElementById('s-name').value.trim().slice(0,20); if(nn && !DB.profiles.some(p=>p!==S && p.name.toLowerCase()===nn.toLowerCase())) S.name=nn; S.exams[T.id]=document.getElementById('s-exam').value; S.koHint=document.getElementById('s-ko').checked; save(); render(); setTimeout(()=>{const m=document.getElementById('s-msg'); if(m) m.hidden=false;},10); };
  document.getElementById('s-reset').onclick=()=>{ document.getElementById('s-confirm').hidden=false; };
  document.getElementById('s-no').onclick=()=>{ document.getElementById('s-confirm').hidden=true; };
  document.getElementById('s-yes').onclick=()=>{ S.log=S.log.filter(r=>!inTopic(r,T)); units.forEach(u=>{ delete S.best[u.id]; u.q.forEach(q=>delete S.free[q.id]); }); save(); render(); };
  $app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{ S.topic=b.dataset.topic; save(); render(); });
}
function conceptHelp(c){
  const H={
    forschen:'"Vermutung = 하기 전에 생각한 것, Beobachtung = 눈으로 본 것"을 실제 실험(얼음 녹이기)으로 구분해 말해 보게 하세요.',
    zustand:'얼음·물·수증기를 냉동실, 컵, 끓는 냄비로 직접 보여 주며 fest/flüssig/gasförmig를 말하게 하세요.',
    temperatur:'"0도 얼고 녹고, 100도 끓는다" 두 숫자만 확실히.',
    uebergang:'화살표 그림(공책 12.10.)을 보며 방향마다 동사(schmelzen, gefrieren, verdunsten, kondensieren)를 말하게 하세요.',
    eis:'물을 컵에 선까지 채워 얼려 보면 바로 이해합니다(얼음이 선보다 높아짐).',
    verdunsten:'빨래가 마르는 것, 웅덩이가 사라지는 것이 모두 verdunsten.',
    kondensieren:'찬 음료 컵 바깥, 샤워 후 거울을 함께 보며 "물은 공기에서 왔다"를 강조하세요.',
    loesen:'소금·모래·기름을 물에 직접 넣어 보세요.',
    boden:'자갈은 빨리, 점토는 거의 안 통과. 점토는 물을 저장한다.',
    quelle:'점토층이 물을 막아 옆으로 흘러나온다는 그림을 같이 그려 보세요.',
    kreislauf:'순서 7단계를 아이가 손가락으로 짚으며 독일어로 말하게 하세요.',
    gefaesse:'투명 호스나 빨대 두 개로 수면 높이가 같아지는 것을 보여 주세요. 서술형 답: "Das Wasser steht in verbundenen Rohren überall gleich hoch."',
    schreiben:'틀린 단어를 3번씩 써 보게 하세요.', demokratie:'공책 정의를 소리 내 읽게 하세요.', hoeren:'단어장에서 "langsam" 버튼으로 듣고 따라 말하게 하세요.'
  };
  return H[c]?`<div class="muted" style="font-size:14px">${esc(H[c])}</div>`:'';
}

document.addEventListener('click',e=>{ if(popEl && !popEl.contains(e.target) && !e.target.closest('.w')) closePop(); });
render();
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude|anthropic/.test(location.hostname)){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();

</script>
