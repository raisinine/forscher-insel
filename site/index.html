<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D55C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forscher-Insel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forscher-Insel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+DE+Grund:wght@300;400&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: ein Schulheft – liniertes Papier, Tintenblau, Sonnengelb als einziger Akzent. Kind: Lernpfad. Eltern: Übersicht. */
:root{
  --paper:#F3F6FA; --card:#FFFFFF; --ink:#16304F; --muted:#5B6C82; --line:#CBD8E8;
  --blue:#1D55C4; --blue-soft:#DDE7FA; --water:#8EBAF2; --sun:#F2B705; --sun-soft:#FFF2C4;
  --ok:#2C8A57; --ok-soft:#DDF2E5; --bad:#C0453A; --bad-soft:#FBE3E0;
  --f-hand:'Playwrite DE Grund', 'Andika', cursive;
  --f-body:'Andika', 'Segoe UI', system-ui, sans-serif;
  --f-ko:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1625; --card:#152038; --ink:#E5ECF6; --muted:#97A7BC; --line:#2A3B57;
  --blue:#86AEFF; --blue-soft:#1C2D4D; --water:#3366B3; --sun:#F5C842; --sun-soft:#3A3115;
  --ok:#62C690; --ok-soft:#173527; --bad:#F2867B; --bad-soft:#3E1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1625; --card:#152038; --ink:#E5ECF6; --muted:#97A7BC; --line:#2A3B57;
  --blue:#86AEFF; --blue-soft:#1C2D4D; --water:#3366B3; --sun:#F5C842; --sun-soft:#3A3115;
  --ok:#62C690; --ok-soft:#173527; --bad:#F2867B; --bad-soft:#3E1F1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.hand{font-family:var(--f-hand);font-weight:400}
.ko{font-family:var(--f-ko)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:2px solid var(--blue);background:var(--blue);color:var(--card);border-radius:12px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2A2200}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;z-index:50;max-width:90vw}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top .kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-family:var(--f-hand);font-weight:400;font-size:clamp(26px,6vw,36px);line-height:1.35;color:var(--blue)}
.countdown{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-weight:700;text-align:center;flex:none}
.countdown b{display:block;font-size:24px;line-height:1}

/* Heft-Linien */
.lined{background:var(--card);border-radius:14px;padding:18px 18px 20px 46px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);background-position:0 14px;border:1px solid var(--line)}
.lined::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--bad);opacity:.35}

/* Lernpfad */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.path::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;border-left:3px dashed var(--line)}
.stop{display:flex;gap:14px;align-items:center;padding:8px 0;position:relative}
.stop button.main{flex:1;min-width:0;display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stop button.main:hover{border-color:var(--blue)}
.drop{width:56px;height:56px;flex:none;display:grid;place-items:center;position:relative;z-index:1}
.drop svg{position:absolute;inset:0;width:100%;height:100%}
.drop span{position:relative;font-weight:700;font-size:18px;margin-top:8px}
.stop .t{font-weight:700;line-height:1.25}
.stop .s{font-size:14px;color:var(--muted)}
.stars{color:var(--sun);letter-spacing:2px;font-size:18px;flex:none}
.stars .off{color:var(--line)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sun-soft);color:var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.tile b{display:block;font-size:17px}
.tile span{font-size:14px;color:var(--muted)}
.tile.hl{background:var(--blue-soft);border-color:var(--blue)}

/* Lernkarte */
.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--blue);border-color:var(--blue)}
.merk{list-style:none;margin:0;padding:0}
.merk li{display:flex;gap:10px;align-items:flex-start;min-height:34px;line-height:34px;padding:0}
.merk li .txt{flex:1;min-width:0}
.merk .icon-btn{width:30px;height:30px;margin-top:2px}
.merk .icon-btn svg{width:16px;height:16px}
.w{border:0;background:var(--sun-soft);color:inherit;border-bottom:2px solid var(--sun);padding:0 3px;border-radius:4px;font:inherit;line-height:1.4;cursor:pointer}
.pop{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));background:var(--card);border:2px solid var(--blue);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop .big{font-size:26px;font-weight:700}
.pop .syl{font-size:18px;color:var(--blue);letter-spacing:.04em}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wcard .wt{font-weight:700;font-size:19px}
.wcard .syl{color:var(--blue);font-size:15px}
.wcard .row{margin-top:4px}
.slow{font-size:13px;width:auto;padding:0 10px;border-radius:999px}

/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.qtext{font-size:20px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.qtext .txt{flex:1;min-width:0}
.fig{margin:12px 0;overflow-x:auto}
.fig svg{max-width:100%;height:auto;display:block;margin:0 auto}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;font-size:17px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tf{flex-direction:row}.tf .opt{flex:1;text-align:center;font-weight:700}
.seq{display:flex;flex-direction:column;gap:8px;min-height:40px;margin-top:12px;padding:10px;border:2px dashed var(--line);border-radius:12px}
.seq .opt{display:flex;gap:10px;align-items:center}
.seq .n{width:28px;height:28px;border-radius:50%;background:var(--blue);color:var(--card);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.sortrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sortrow .item{font-weight:700;min-width:80px;flex:1}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.matchrow select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.cloze{font-size:18px;line-height:2.4}
.blank{min-width:110px;border:0;border-bottom:3px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;padding:2px 10px;font:inherit;font-weight:700;color:var(--blue)}
.blank.active{background:var(--sun-soft);border-color:var(--sun)}
.blank.right{border-color:var(--ok);color:var(--ok)}.blank.wrong{border-color:var(--bad);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
textarea{width:100%;min-height:120px;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);line-height:34px}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb p{margin:4px 0 0;font-weight:400;color:var(--ink)}
.model{background:var(--sun-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.qfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

.result{text-align:center;padding:20px 0}
.result .score{font-family:var(--f-hand);font-size:44px;color:var(--blue)}
.result .stars{font-size:40px}
.rev{text-align:left;margin-top:16px}
.rev li{margin-bottom:10px}

/* Elternbereich */
.parent{font-family:var(--f-ko);font-size:15.5px}
.parent h2{font-size:19px;margin:26px 0 10px}
.parent .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--f-body)}
.kpi span{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:13px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.meter{height:8px;border-radius:999px;background:var(--line);width:100px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.meter i{display:block;height:100%}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.p-none{background:var(--line);color:var(--muted)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mid{background:var(--sun-soft);color:var(--ink)}.p-ok{background:var(--ok-soft);color:var(--ok)}
.obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.obs li{display:flex;gap:10px;align-items:flex-start}
.obs .pill{margin-top:2px}
.wrongitem{border-bottom:1px solid var(--line);padding:10px 0}
.wrongitem:last-child{border-bottom:0}
.de{font-family:var(--f-body)}
details.unit{border-bottom:1px solid var(--line);padding:10px 0}
details.unit summary{cursor:pointer;font-weight:700}
.dict{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;margin-top:8px}
.dict .de{font-weight:700}
.days{display:flex;gap:6px;align-items:flex-end;height:70px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.days i{display:block;width:100%;max-width:28px;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.set{display:grid;gap:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.set input{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.gate{max-width:360px;margin:40px auto;text-align:center}
.gate input{font-size:24px;width:140px;text-align:center;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.foot-link{display:block;margin:28px auto 0;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px}
@media (max-width:480px){.qtext{font-size:18px}.matchrow{grid-template-columns:1fr}.lined{padding-left:38px}.lined::before{left:24px}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.blank{transition:background .15s,border-color .15s}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===== Inhalte: Reihenfolge = Lernreihenfolge ===== */
const UNITS = [
{
  id:'u1', no:1, title:'Forschen wie im Labor', sub:'Vermutung und Beobachtung', ko:'실험 기록 방법', c:'forschen',
  merk:[
    'Bei einem [[Versuch]] probieren wir etwas aus und schauen genau hin.',
    'Der [[Versuchsaufbau]] zeigt, was wir aufbauen. Wir zeichnen ihn.',
    'Die [[Vermutung]] ist, was ich vorher glaube. Ich schreibe: „Ich vermute, dass …“',
    'Eine Vermutung darf auch falsch sein. Das ist ganz normal!',
    'Die [[Beobachtung]] ist, was ich wirklich sehe. Ich schreibe: „Ich beobachte, dass …“',
    'Am Ende vergleiche ich: Hatte ich recht?'
  ],
  koSum:'실험 기록지 형식: Versuchsaufbau(실험 장치 그림) → Vermutung(예상, "Ich vermute, dass …") → Beobachtung(실제로 본 것). 시험에서 예상과 관찰을 구분하는 문제가 자주 나옵니다. 따님 기록지에는 관찰란에 실제 결과 대신 예상과 비슷한 문장을 쓴 곳이 있어, "눈으로 본 것만 쓰기"를 연습하면 좋습니다.',
  words:[
    {w:'der Versuch', s:'Ver·such', ko:'실험', d:'Wir probieren etwas aus.'},
    {w:'der Versuchsaufbau', s:'Ver·suchs·auf·bau', ko:'실험 장치(그림)', d:'Was wir für den Versuch aufbauen.'},
    {w:'die Vermutung', s:'Ver·mu·tung', ko:'예상, 가설', d:'Was ich vorher glaube.'},
    {w:'die Beobachtung', s:'Be·ob·ach·tung', ko:'관찰', d:'Was ich wirklich sehe.'},
    {w:'vermuten', s:'ver·mu·ten', ko:'예상하다', d:'Etwas vorher glauben.'},
    {w:'beobachten', s:'be·ob·ach·ten', ko:'관찰하다', d:'Genau hinschauen.'}
  ],
  q:[
    {id:'f1', t:'order', q:'Bring die Teile vom Versuchsprotokoll in die richtige Reihenfolge.', ko:'실험 기록 순서를 맞추세요.',
      items:['Versuchsaufbau zeichnen','Vermutung aufschreiben','Versuch durchführen und genau hinschauen','Beobachtung aufschreiben'],
      ex:'Erst aufbauen, dann vermuten, dann ausprobieren, dann aufschreiben, was man sieht.', exk:'장치 그리기 → 예상 쓰기 → 실험 → 관찰 쓰기 순서.'},
    {id:'f2', t:'mc', q:'„Ich glaube, der Eiswürfel in der Sonne schmilzt schneller.“ Was ist das?', ko:'"햇빛 아래 얼음이 더 빨리 녹을 것 같다"는 무엇인가?',
      o:['eine Vermutung','eine Beobachtung','ein Versuchsaufbau'], a:0, ex:'„Ich glaube …“ – das ist eine Vermutung.', exk:'"~일 것 같다"는 예상(Vermutung).'},
    {id:'f3', t:'mc', q:'„Nach 10 Minuten ist der Eiswürfel in der Sonne schon geschmolzen.“ Was ist das?', ko:'"10분 뒤 얼음이 이미 녹았다"는 무엇인가?',
      o:['eine Vermutung','eine Beobachtung','ein Versuchsaufbau'], a:1, ex:'Das hat man wirklich gesehen. Das ist eine Beobachtung.', exk:'실제로 본 것 = 관찰(Beobachtung).'},
    {id:'f4', t:'tf', q:'Eine Vermutung muss immer richtig sein.', ko:'예상은 항상 맞아야 한다.', a:false,
      ex:'Eine Vermutung darf falsch sein. Der Versuch zeigt uns, was stimmt.', exk:'예상은 틀려도 괜찮다.'},
    {id:'f5', t:'mc', q:'Wie fängt eine Vermutung an?', ko:'예상 문장은 어떻게 시작하나?',
      o:['„Ich vermute, dass …“','„Ich habe gesehen, dass …“','„Am Ende war …“'], a:0, ex:'Eine Vermutung beginnt mit „Ich vermute, dass …“.', exk:'"Ich vermute, dass …"로 시작.'}
  ]
},
{
  id:'u2', no:2, title:'Die drei Zustände von Wasser', sub:'fest · flüssig · gasförmig', ko:'물의 세 가지 상태', c:'zustand',
  merk:[
    'Wasser gibt es in drei [[Zuständen|Aggregatzustand]]: fest, flüssig und gasförmig.',
    '[[fest]]: Das ist Eis. Eis ist hart und behält seine Form.',
    '[[flüssig]]: Das ist Wasser. Es fließt und passt sich jedem Gefäß an.',
    '[[gasförmig]]: Das ist [[Wasserdampf]]. Man kann ihn meistens nicht sehen.',
    'Bei 0 °C [[gefriert|gefrieren]] Wasser zu Eis. Bei 0 °C [[schmilzt|schmelzen]] Eis auch wieder. 0 °C ist der [[Gefrierpunkt]] und der [[Schmelzpunkt]].',
    'Bei 100 °C kocht Wasser. Es [[verdampft|verdampfen]]. 100 °C ist der [[Siedepunkt]].',
    'Wasser kann auch ohne Kochen langsam zu Wasserdampf werden. Das heißt [[verdunsten]].',
    'Wenn Wasserdampf abkühlt, wird er wieder zu Wasser. Das heißt [[kondensieren]].'
  ],
  koSum:'물의 세 상태: fest 고체 = Eis 얼음, flüssig 액체 = Wasser 물, gasförmig 기체 = Wasserdampf 수증기. 상태 변화: schmelzen 녹다(얼음→물), gefrieren 얼다(물→얼음), verdunsten 끓지 않고 천천히 증발, verdampfen 끓어서 기체가 됨(100 °C), kondensieren 응결(수증기→물). 0 °C = Gefrierpunkt/Schmelzpunkt, 100 °C = Siedepunkt. 공책에 verdunsten을 "verdusten"으로 쓴 곳이 있습니다.',
  words:[
    {w:'der Aggregatzustand', s:'Ag·gre·gat·zu·stand', ko:'물질의 상태', d:'fest, flüssig oder gasförmig.'},
    {w:'fest', s:'fest', ko:'고체의', d:'Hart, behält seine Form – wie Eis.'},
    {w:'flüssig', s:'flüs·sig', ko:'액체의', d:'Es fließt – wie Wasser.'},

<script>
(function(){
'use strict';
const $app = document.getElementById('app');
const KEY = 'wasserforscher-v1';
const ICON = {
  spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
};

/* ---------- Speicher ---------- */
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.log) return s; }catch(e){} return {name:'', log:[], free:{}, best:{}, exam:'', koHint:false, extra:true}; }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Daten aufbereiten ---------- */
const QBY = {}, UBY = {}, GLOSS = {};
UNITS.forEach(u=>{ UBY[u.id]=u; u.q.forEach(q=>{ q.u=u.id; q.c=q.c||u.c; QBY[q.id]=q; });
  u.words.forEach(w=>{ const base=w.w.replace(/^(der|die|das)\s+/,''); GLOSS[base.toLowerCase()]=w; w.u=u.id; }); });
const ALLWORDS = UNITS.flatMap(u=>u.words);

/* ---------- Hilfen ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain = s => String(s).replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g,'$1');
function rich(s){
  return esc(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,txt,key)=>`<button class="w" data-word="${esc(key||txt)}" data-say="${esc(txt)}">${txt}</button>`);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
const spk = (say,cls='') => `<button class="icon-btn ${cls}" data-speak="${esc(say)}" aria-label="Vorlesen">${ICON.spk}</button>`;

/* ---------- Vorlesen ---------- */
let voice=null, warned=false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));
  voice = vs.find(v=>/de-DE/i.test(v.lang) && /google|anna|katja|helena|hedda|petra|marlene|vicki/i.test(v.name)) || vs.find(v=>/de-DE/i.test(v.lang)) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if(!('speechSynthesis' in window)){ toast('Vorlesen geht auf diesem Gerät leider nicht.'); return; }
  let t = plain(text).replace(/(\d+)\s*°C/g,'$1 Grad Celsius').replace(/·/g,'').replace(/[„“]/g,'').replace(/___/g,'Lücke').replace(/\s…/g,' ');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang='de-DE'; if(voice) u.voice=voice; u.rate = slow?0.6:0.88; u.pitch=1.05;
  if(!voice && !warned){ warned=true; toast('Keine deutsche Stimme gefunden. Das Gerät liest vielleicht mit Akzent.'); }
  speechSynthesis.speak(u);
}

/* ---------- Statistik ---------- */
function record(q, ok, ans, mode, extra){
  S.log.push({q:q.id, u:q.u, c:q.c, ok:!!ok, a:ans, m:mode, t:Date.now(), ...(extra||{})});
  if(S.log.length>3000) S.log=S.log.slice(-3000);
  save();
}
function latestByQ(){ const m={}; S.log.forEach(r=>{ if(r.m!=='hoer') m[r.q]=r; }); return m; }
function unitStats(uid){
  const u=UBY[uid], L=latestByQ(); let seen=0, ok=0;
  u.q.forEach(q=>{ if(L[q.id]){ seen++; if(L[q.id].ok) ok++; } });
  const tries = S.log.filter(r=>r.u===uid && r.m!=='hoer').length;
  return {seen, ok, total:u.q.length, pct: seen? Math.round(ok/seen*100):null, tries};
}
function starsFor(uid){ const b=S.best[uid]; if(b==null) return 0; return b>=90?3: b>=70?2: b>=40?1:0; }
const starHTML = n => `<span class="stars" aria-label="${n} von 3 Sternen">${'★'.repeat(n)}<span class="off">${'★'.repeat(3-n)}</span></span>`;
function daysLeft(){ if(!S.exam) return null; const d=new Date(S.exam+'T08:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }

/* ---------- SVG-Bilder ---------- */
const FIG = {

  <path d="M10 40 L190 40 L300 150 L10 150 Z" fill="var(--line)"/>

utube:`<svg viewBox="0 0 260 190" width="260" role="img" aria-label="Zwei Trichter an einem Schlauch, rechter Trichter höher, links Wasserstand markiert">
  <path d="M40 60 L55 85 L55 150 Q55 175 80 175 L180 175 Q205 175 205 150 L205 45" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>

function tapsFig(level){ // level y
  const taps=[45,85,125];
  return `<svg viewBox="0 0 240 190" width="240" role="img" aria-label="Behälter mit Rohr und drei Wasserhähnen">

  ${taps.map(y=>`<path d="M178 ${y} h22 v10" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="190" cy="${y-6}" r="4" fill="var(--ink)"/>`).join('')}

FIG.taps2 = tapsFig(65); FIG.taps0 = tapsFig(138);

/* ---------- Router ---------- */
let view={name:'home'};
function go(v){ view=v; if('speechSynthesis' in window) speechSynthesis.cancel(); render(); window.scrollTo(0,0); }
function render(){
  closePop();
  const v=view.name;
  if(v==='home') return home();
  if(v==='unit') return unitView();
  if(v==='quiz') return quizView();
  if(v==='result') return resultView();
  if(v==='dict') return dictView();
  if(v==='hoer') return hoerView();
  if(v==='gate') return gateView();
  if(v==='parent') return parentView();
}

/* ---------- Start ---------- */
function home(){
  const units = UNITS.filter(u=>!u.extra || S.extra);
  const dl = daysLeft();
  const L = latestByQ();
  const wrongCount = Object.values(L).filter(r=>!r.ok).length;
  const next = units.find(u=>starsFor(u.id)<2) || units[0];
  $app.innerHTML = `
  <header class="top">
    <div><div class="kicker">Forscher-Insel · Klasse 3 · Sachunterricht · Wasser</div>
    <h1>${S.name?`Hallo ${esc(S.name)}!`:'Forscher-Insel'}</h1></div>
    ${dl!=null && dl>=0 ? `<div class="countdown"><b>${dl}</b>${dl===1?'Tag':'Tage'} bis zum Test</div>`:''}
  </header>
  ${S.name?'':`<div class="tile hl row" style="margin-bottom:14px"><label for="nm" style="flex:1;min-width:160px">Wie heißt du?</label><input id="nm" style="font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);flex:2;min-width:0"><button class="btn" id="nmok">Los!</button></div>`}
  <div class="tiles">
    <button class="tile hl" data-go-unit="${next.id}"><b>Weiterlernen</b><span>${next.no}. ${esc(next.title)}</span></button>
    <button class="tile" id="test"><b>Probetest</b><span>12 gemischte Aufgaben</span></button>
    <button class="tile" id="fehler" ${wrongCount?'':'disabled style="opacity:.55"'}><b>Fehlerkiste</b><span>${wrongCount} Aufgabe${wrongCount===1?'':'n'} nochmal üben</span></button>
    <button class="tile" id="dict"><b>Wörter hören</b><span>${ALLWORDS.length} schwere Wörter mit Ton</span></button>
  </div>
  <h2 class="hand" style="font-size:22px;color:var(--blue);margin:8px 0 6px">Dein Lernweg</h2>
  <ol class="path">${units.map(u=>{
    const st=unitStats(u.id), n=starsFor(u.id);
    const fill = n>=2?'var(--blue)':st.seen?'var(--water)':'var(--line)';
    const tc = n>=2?'var(--card)':'var(--ink)';
    return `<li class="stop"><div class="drop"><svg viewBox="0 0 56 56" aria-hidden="true"><path d="M28 3 C28 3 8 26 8 37 a20 20 0 0 0 40 0 C48 26 28 3 28 3z" fill="${fill}"/></svg><span style="color:${tc}">${u.no}</span></div>
      <button class="main" data-go-unit="${u.id}"><div style="flex:1;min-width:0"><div class="t">${esc(u.title)} ${u.extra?'<span class="tag">Extra</span>':''}</div><div class="s">${esc(u.sub)}</div></div>${starHTML(n)}</button></li>`;}).join('')}
  </ol>
  <button class="foot-link ko" id="parent">부모님 화면 (Für Eltern)</button>`;
  const nm=document.getElementById('nmok');
  if(nm) nm.onclick=()=>{ const v=document.getElementById('nm').value.trim(); if(v){ S.name=v.slice(0,20); save(); render(); } };
  bindCommon();
  document.getElementById('test').onclick=()=>startQuiz('test');
  const f=document.getElementById('fehler'); if(wrongCount) f.onclick=()=>startQuiz('fehler');
  document.getElementById('dict').onclick=()=>go({name:'dict'});
  document.getElementById('parent').onclick=()=>go({name:'gate'});
}

/* ---------- Einheit ---------- */
function unitView(){
  const u=UBY[view.id], tab=view.tab||'lernen', st=unitStats(u.id);
  let body='';
  if(tab==='lernen'){
    body=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted">Tippe auf gelbe Wörter: Du hörst sie und siehst, was sie bedeuten.</span>
      <button class="btn ghost" data-speak="${esc(u.merk.join(' '))}">Alles vorlesen</button></div>
      <div class="lined"><ul class="merk">${u.merk.map(m=>`<li>${spk(m)}<span class="txt">${rich(m)}</span></li>`).join('')}</ul></div>
      <div class="qfoot"><button class="btn ghost" data-tab="woerter">Wörter</button><button class="btn" id="start">Jetzt üben</button></div>`;
  } else if(tab==='woerter'){
    body=`<p class="muted">Hör zu und sprich nach. Mit „langsam“ hörst du das Wort ganz deutlich.</p>${wordCards(u.words)}
      <div class="qfoot"><button class="btn" id="start">Jetzt üben</button></div>`;
  } else {
    body=`<div class="lined" style="padding-top:20px"><p style="margin:0;line-height:34px"><b>${u.q.length} Aufgaben</b> warten auf dich.<br>
      ${st.seen?`Zuletzt: ${st.ok} von ${st.seen} richtig.`:'Du hast hier noch nicht geübt.'}</p></div>
      <div class="qfoot"><button class="btn" id="start">Los geht’s</button></div>`;
  }
  $app.innerHTML=`<button class="back" id="bk">‹ Zurück</button>

    <div class="tabs" role="tablist">${[['lernen','Lernen'],['woerter','Wörter'],['ueben','Üben']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
  document.getElementById('bk').onclick=()=>go({name:'home'});
  $app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; render(); });
  const s=document.getElementById('start'); if(s) s.onclick=()=>startQuiz('practice',u.id);
  bindCommon();
}
function wordCards(ws){

function startQuiz(mode, uid){

function ready(q,st){
  if(q.t==='mc'||q.t==='tf') return st.sel!=null;
  if(q.t==='order') return st.seq.length===q.items.length;
  if(q.t==='sort') return q.items.every((_,i)=>st.sel[i]!=null);
  if(q.t==='match') return q.pairs.every((_,i)=>st.sel[i]);
  if(q.t==='cloze') return st.fill.every(Boolean);
  return false;
}
function evaluate(q,st){
  if(q.t==='mc') return {ok:st.sel===q.a, ans:q.o[st.sel]};
  if(q.t==='tf') return {ok:(st.sel===0)===q.a, ans:st.sel===0?'Richtig':'Falsch'};
  if(q.t==='order') return {ok:st.seq.every((x,i)=>x===q.items[i]), ans:st.seq.join(' → ')};
  if(q.t==='sort') return {ok:q.items.every(([_,c],i)=>st.sel[i]===c), ans:q.items.map(([it],i)=>it+': '+q.cats[st.sel[i]]).join(', ')};
  if(q.t==='match') return {ok:q.pairs.every(([_,r],i)=>st.sel[i]===r), ans:q.pairs.map(([l],i)=>l+' = '+st.sel[i]).join('; ')};
  if(q.t==='cloze') return {ok:st.fill.every((v,i)=>v===q.ans[i]), ans:st.fill.join(', ')};
}
function correctText(q){
  if(q.t==='mc') return q.o[q.a];
  if(q.t==='tf') return q.a?'Richtig':'Falsch';
  if(q.t==='order') return q.items.join(' → ');
  if(q.t==='sort') return q.items.map(([it,c])=>it+': '+q.cats[c]).join(', ');
  if(q.t==='match') return q.pairs.map(p=>p.join(' = ')).join('; ');
  if(q.t==='cloze') return q.ans.join(', ');
  if(q.t==='free') return q.model;
}
function resultView(){

function parentView(){

  const hoer=S.log.filter(r=>r.m==='hoer'); if(hoer.length){ cc.hoeren={n:hoer.length, ok:hoer.filter(r=>r.ok).length}; }
  const weak=Object.entries(cc).map(([c,v])=>({c,n:v.n,pct:Math.round(v.ok/v.n*100)})).filter(x=>x.pct<85).sort((a,b)=>a.pct-b.pct).slice(0,6);

  // Plan

    const pd=new Date(S.exam); pd.setDate(pd.getDate()-1);
    plan=`<table class="tbl"><thead><tr><th>날짜</th><th>할 일</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="2">모든 단원을 잘 이해했습니다. 모의시험으로 마무리하세요.</td></tr>'}
      <tr><td class="de">${pd.getMonth()+1}/${pd.getDate()}</td><td>앱 Probetest + 출력한 모의시험 B, 틀린 문제는 Fehlerkiste로 복습</td></tr></tbody></table>`;
  }
  $app.innerHTML=`<div class="parent">
  <button class="back" id="bk">‹ 아이 화면으로</button>
  <header class="top" style="margin-top:6px"><div><div class="kicker">부모님 화면</div><h1 style="font-family:var(--f-ko);font-weight:700;color:var(--ink);font-size:26px">${S.name?esc(S.name)+'의 ':''}과학(물) 학습 현황</h1></div>
   ${dl!=null&&dl>=0?`<div class="countdown"><b class="de">D-${dl}</b>시험</div>`:''}</header>

  <div class="kpis">
    <div class="card kpi"><b>${seen}/${totalQ}</b><span>풀어 본 문제</span></div>
    <div class="card kpi"><b>${seen?Math.round(okN/seen*100)+'%':'–'}</b><span>현재 정답률(문제별 최근 답)</span></div>
    <div class="card kpi"><b>${units.filter(u=>starsFor(u.id)>=2).length}/${units.length}</b><span>별 2개 이상 단원</span></div>
    <div class="card kpi"><b style="font-size:18px;line-height:1.9">${last}</b><span>마지막 학습</span></div>
  </div>

  <h2>최근 7일 학습량</h2>
  <div class="card"><div class="days">${days.map(d=>`<div><i style="height:${Math.round(d.n/maxD*50)}px" title="${d.n}문제"></i><span class="de" style="color:var(--ink);font-size:12px">${d.n}</span>${d.lab}</div>`).join('')}</div></div>

  <h2>단원별 이해도 <span class="muted" style="font-size:13px;font-weight:400">(공부 순서대로)</span></h2>
  <div class="card scroll"><table class="tbl"><thead><tr><th>단원</th><th>정답률</th><th>상태</th><th>시도</th></tr></thead><tbody>
   ${units.map(u=>{ const st=unitStats(u.id); return `<tr><td><b>${u.no}. ${esc(u.ko)}</b><br><span class="de muted" style="font-size:13px">${esc(u.title)}</span></td><td style="white-space:nowrap">${meter(st.pct)}</td><td>${statusPill(st)}</td><td class="de">${st.tries}</td></tr>`;}).join('')}
  </tbody></table></div>

  <h2>보충이 필요한 개념</h2>
  <div class="card">${weak.length? `<ul class="obs">${weak.map(w=>`<li><span class="pill ${w.pct<60?'p-bad':'p-mid'} de">${w.pct}%</span><div><b>${CONCEPTS[w.c]||w.c}</b> <span class="muted">(${w.n}문제 기준)</span>${conceptHelp(w.c)}</div></li>`).join('')}</ul>`
    : `<p class="muted" style="margin:0">${seen?'정답률 85% 미만인 개념이 없습니다.':'아직 푼 문제가 없습니다. 아이가 문제를 풀면 여기에 약한 개념이 표시됩니다.'}</p>`}</div>

  <h2>사진(공책·학습지) 분석 소견</h2>
  <div class="card"><ul class="obs">${OBSERVATIONS.todo.map(([k,t])=>`<li><span class="pill ${k==='우선순위 높음'?'p-bad':'p-mid'}">${k}</span><span>${esc(t)}</span></li>`).join('')}</ul>
   <p style="margin:14px 0 6px;font-weight:700">잘한 점</p><ul class="obs">${OBSERVATIONS.good.map(t=>`<li><span class="pill p-ok">잘함</span><span>${esc(t)}</span></li>`).join('')}</ul></div>

  <h2>최근 틀린 문제</h2>
  <div class="card">${wrongs.length? wrongs.map(r=>{ const q=QBY[r.q]; if(!q) return ''; return `<div class="wrongitem"><div class="muted" style="font-size:13px">${UBY[q.u].no}. ${esc(UBY[q.u].ko)} · ${fmt(r.t)}${r.m==='test'?' · 모의시험':''}</div>
     <div><b>${esc(q.ko)}</b></div><div class="de muted" style="font-size:14px">${esc(plain(q.q))}</div>
     <div style="margin-top:4px">아이 답: <span class="de" style="color:var(--bad)">${esc(r.a||'')}</span></div>
     <div>정답: <span class="de" style="color:var(--ok)">${esc(correctText(q))}</span></div>
     ${q.exk?`<div class="muted">설명: ${esc(q.exk)}</div>`:''}</div>`;}).join('') : '<p class="muted" style="margin:0">틀린 문제가 없습니다.</p>'}</div>

  <h2>서술형 답안</h2>
  <div class="card">${units.flatMap(u=>u.q.filter(q=>q.t==='free')).map(q=>{ const f=S.free[q.id];
     return `<div class="wrongitem"><b>${esc(q.ko)}</b><div style="margin-top:4px">${f?`아이 답: <span class="de">${esc(f.text)}</span> <span class="pill ${f.self==='ja'?'p-ok':f.self==='teil'?'p-mid':'p-bad'}">스스로 평가: ${f.self==='ja'?'다 씀':f.self==='teil'?'일부':'못 씀'}</span>`:'<span class="muted">아직 안 씀</span>'}</div>
     <div class="muted" style="margin-top:4px">모범 답안: <span class="de">${esc(q.model)}</span><br>뜻: ${esc(q.mk)}</div></div>`;}).join('')}
   <p class="muted" style="margin:8px 0 0;font-size:13px">서술형은 아이가 스스로 모범 답안과 비교해 평가합니다. 실제 내용은 위 답안을 직접 확인해 주세요.</p></div>

  ${hoerWrong.length?`<h2>듣기 게임에서 틀린 단어</h2><div class="card"><div class="dict">${hoerWrong.map(wd=>{ const w=ALLWORDS.find(x=>x.w===wd); return `<span class="de">${esc(wd)}</span><span>${esc(w?w.ko:'')}</span>${spk(wd)}`;}).join('')}</div></div>`:''}

  ${plan?`<h2>시험까지 추천 계획</h2><div class="card scroll">${plan}</div>`:''}

  <h2>단원별 설명과 단어 (부모님용)</h2>
  <div class="card">${units.map(u=>`<details class="unit"><summary>${u.no}. ${esc(u.ko)} <span class="de muted" style="font-weight:400">· ${esc(u.title)}</span></summary>
    <p>${esc(u.koSum)}</p><div class="dict">${u.words.map(w=>`<span class="de">${esc(w.w)}</span><span>${esc(w.ko)}</span>${spk(w.w)}`).join('')}</div></details>`).join('')}</div>

  <h2>모의시험 출력</h2>
  <div class="card"><p style="margin:0 0 10px">아래 PDF를 열어 인쇄하세요. 정답지는 아이가 보지 않게 따로 보관하세요.</p>
   <div class="row"><a class="btn" href="pdf/Probetest_Wasser_A_B.pdf" target="_blank" rel="noopener" style="text-decoration:none">모의시험 A·B 열기</a>
   <a class="btn ghost" href="pdf/Loesungen_Eltern.pdf" target="_blank" rel="noopener" style="text-decoration:none">부모용 정답지 열기</a></div>
   <p class="muted" style="margin:10px 0 0;font-size:13px">앱 안의 <span class="de">Probetest</span>는 매번 12문제를 무작위로 냅니다.</p></div>

  <h2>설정</h2>
  <div class="card set">
    <label>아이 이름 (아이 화면 인사말)<input id="s-name" value="${esc(S.name)}"></label>
    <label>시험 날짜<input id="s-exam" type="date" value="${esc(S.exam)}"></label>
    <label style="flex-direction:row;align-items:center;gap:8px"><input id="s-ko" type="checkbox" ${S.koHint?'checked':''}> 아이 화면 단어 카드에 한국어 뜻도 표시</label>
    <label style="flex-direction:row;align-items:center;gap:8px"><input id="s-extra" type="checkbox" ${S.extra?'checked':''}> 추가 단원(민주주의·선거) 보이기</label>
    <div class="row"><button class="btn" id="s-save">저장</button><span id="s-msg" class="muted" hidden>저장했습니다.</span></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn ghost" id="s-reset" style="border-color:var(--bad);color:var(--bad)">학습 기록 지우기</button>
      <span id="s-confirm" hidden>정말 지울까요? <button class="btn" id="s-yes" style="background:var(--bad);border-color:var(--bad)">지우기</button> <button class="btn ghost" id="s-no">취소</button></span></div>
    <p class="muted" style="margin:0;font-size:13px">학습 기록은 이 기기의 이 브라우저에만 저장됩니다. 아이가 쓰는 기기에서 이 화면을 열어 확인하세요.</p>
  </div></div>`;
  bindCommon();
  document.getElementById('bk').onclick=()=>go({name:'home'});
  document.getElementById('s-save').onclick=()=>{ S.name=document.getElementById('s-name').value.trim().slice(0,20); S.exam=document.getElementById('s-exam').value; S.koHint=document.getElementById('s-ko').checked; S.extra=document.getElementById('s-extra').checked; save(); render(); setTimeout(()=>{const m=document.getElementById('s-msg'); if(m) m.hidden=false;},10); };
  document.getElementById('s-reset').onclick=()=>{ document.getElementById('s-confirm').hidden=false; };
  document.getElementById('s-no').onclick=()=>{ document.getElementById('s-confirm').hidden=true; };
  document.getElementById('s-yes').onclick=()=>{ S.log=[]; S.free={}; S.best={}; save(); render(); };
}
function conceptHelp(c){
  const H={
    forschen:'"Vermutung = 하기 전에 생각한 것, Beobachtung = 눈으로 본 것"을 실제 실험(얼음 녹이기)으로 구분해 말해 보게 하세요.',
    zustand:'얼음·물·수증기를 냉동실, 컵, 끓는 냄비로 직접 보여 주며 fest/flüssig/gasförmig를 말하게 하세요.',
    temperatur:'"0도 얼고 녹고, 100도 끓는다" 두 숫자만 확실히.',
    uebergang:'화살표 그림(공책 12.10.)을 보며 방향마다 동사(schmelzen, gefrieren, verdunsten, kondensieren)를 말하게 하세요.',
    eis:'물을 컵에 선까지 채워 얼려 보면 바로 이해합니다(얼음이 선보다 높아짐).',
    verdunsten:'빨래가 마르는 것, 웅덩이가 사라지는 것이 모두 verdunsten.',
    kondensieren:'찬 음료 컵 바깥, 샤워 후 거울을 함께 보며 "물은 공기에서 왔다"를 강조하세요.',
    loesen:'소금·모래·기름을 물에 직접 넣어 보세요.',
    boden:'자갈은 빨리, 점토는 거의 안 통과. 점토는 물을 저장한다.',
    quelle:'점토층이 물을 막아 옆으로 흘러나온다는 그림을 같이 그려 보세요.',
    kreislauf:'순서 7단계를 아이가 손가락으로 짚으며 독일어로 말하게 하세요.',
    gefaesse:'투명 호스나 빨대 두 개로 수면 높이가 같아지는 것을 보여 주세요. 서술형 답: "Das Wasser steht in verbundenen Rohren überall gleich hoch."',
    schreiben:'틀린 단어를 3번씩 써 보게 하세요.', demokratie:'공책 정의를 소리 내 읽게 하세요.', hoeren:'단어장에서 "langsam" 버튼으로 듣고 따라 말하게 하세요.'
  };
  return H[c]?`<div class="muted" style="font-size:14px">${esc(H[c])}</div>`:'';
}

document.addEventListener('click',e=>{ if(popEl && !popEl.contains(e.target) && !e.target.closest('.w')) closePop(); });
